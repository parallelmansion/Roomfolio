<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f5f0">
  <title>Login | Roomfolio</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #272522;
      --muted: #77736c;
      --paper: #f7f5f0;
      --panel: #fffdfa;
      --line: #dfd9cf;
      --accent: #31483b;
      --accent-hover: #203329;
      --danger: #aa4037;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background: var(--paper);
    }

    .login-shell {
      width: min(100%, 420px);
    }

    .brand {
      margin: 0 0 30px;
      text-align: center;
      font-family: Georgia, "Times New Roman", "Hiragino Mincho ProN", serif;
      font-size: clamp(2rem, 8vw, 2.75rem);
      font-weight: 500;
      letter-spacing: -0.05em;
    }

    .login-card {
      padding: clamp(28px, 7vw, 40px);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 18px 45px rgba(52, 46, 39, 0.08);
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }

    .lead {
      margin: 10px 0 28px;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.7;
    }

    .field + .field { margin-top: 18px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.88rem;
      font-weight: 650;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      color: var(--ink);
      background: #fff;
      font: inherit;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(49, 72, 59, 0.14);
    }

    .submit-button {
      width: 100%;
      min-height: 48px;
      margin-top: 28px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: var(--accent);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 160ms ease, opacity 160ms ease;
    }

    .submit-button:hover:not(:disabled) { background: var(--accent-hover); }
    .submit-button:disabled { cursor: wait; opacity: 0.58; }

    .status {
      min-height: 1.5em;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.55;
    }

    .status[hidden] { display: none; }
    .status.is-error { color: var(--danger); }
  </style>
</head>
<body>
  <main class="login-shell">
    <p class="brand" aria-label="Roomfolio">Roomfolio</p>

    <section class="login-card" aria-labelledby="login-title">
      <h1 id="login-title">ログイン</h1>
      <p class="lead">Roomfolioを管理するためにログインしてください。</p>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <button id="submit-button" class="submit-button" type="submit">ログインする</button>
        <p id="status" class="status" role="status" aria-live="polite" hidden></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-client.js"></script>
  <script>
    (() => {
      "use strict";

      const loginForm = document.getElementById("login-form");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const submitButton = document.getElementById("submit-button");
      const status = document.getElementById("status");
      const supabaseClient = window.supabaseClient;

      function setStatus(message, isError = false) {
        status.textContent = message;
        status.hidden = !message;
        status.classList.toggle("is-error", isError);
      }

      function setSubmitting(isSubmitting) {
        submitButton.disabled = isSubmitting;
        submitButton.textContent = isSubmitting ? "ログイン中…" : "ログインする";
      }

      async function redirectIfSignedIn() {
        if (!supabaseClient) {
          setStatus("ログインの準備に失敗しました。時間をおいて再度お試しください。", true);
          return;
        }

        try {
          const { data, error } = await supabaseClient.auth.getUser();
          if (error) throw error;
          if (data?.user) {
            window.location.replace("/");
          }
        } catch (error) {
          // 有効なsessionがない場合は、Loginフォームをそのまま表示する。
        }
      }

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!supabaseClient) {
          setStatus("ログインの準備に失敗しました。時間をおいて再度お試しください。", true);
          return;
        }

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          setStatus("EmailとPasswordを入力してください。", true);
          return;
        }

        setSubmitting(true);
        setStatus("ログインを確認しています。");

        try {
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;
          if (!data?.session) {
            throw new Error("Auth session was not created.");
          }

          window.location.assign("/");
        } catch (error) {
          console.error("ログインに失敗しました", error);
          setStatus("ログインできませんでした。EmailとPasswordを確認してください。", true);
          setSubmitting(false);
        }
      });

      redirectIfSignedIn();
    })();
  </script>
</body>
</html>
