<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f1eb">
  <title>Roomfolio</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #292722;
      --muted: #736f67;
      --paper: #f4f1eb;
      --panel: #fffdfa;
      --line: #ded8cd;
      --accent: #33483c;
      --accent-soft: #e4ece3;
      --danger: #9b4138;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--paper);
    }

    .page-shell {
      width: min(100% - 32px, 1100px);
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }

    .brand {
      margin: 0;
      font-family: Georgia, "Times New Roman", "Hiragino Mincho ProN", serif;
      font-size: clamp(1.7rem, 5vw, 2.25rem);
      font-weight: 500;
      letter-spacing: -0.05em;
    }

    .page-label {
      margin: 0;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status-card {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 76px;
      padding: 20px 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      color: var(--muted);
      background: var(--panel);
      line-height: 1.65;
    }

    .status-card[hidden] { display: none; }
    .status-card.is-error { border-color: #e3bdb8; color: var(--danger); background: #fff9f8; }

    .status-dot {
      width: 9px;
      height: 9px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: var(--accent);
    }

    .status-card.is-error .status-dot { background: var(--danger); }

    .home-content[hidden] { display: none; }

    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 10px 0 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2.1rem);
      letter-spacing: -0.04em;
    }

    .intro p {
      max-width: 420px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.7;
    }

    .room-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.65fr) minmax(270px, 0.7fr);
      gap: 20px;
      align-items: start;
    }

    .room-card,
    .identity-card,
    .assets-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 12px 30px rgba(52, 46, 39, 0.055);
    }

    .room-stage {
      position: relative;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #d7d2c8 center / cover no-repeat;
      isolation: isolate;
    }

    .room-stage::after {
      position: absolute;
      inset: 0;
      z-index: -1;
      content: "";
      background: rgba(25, 29, 25, 0.08);
      pointer-events: none;
    }

    .room-stage.is-empty::before {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      content: "背景を確認できません。";
      color: rgba(40, 37, 33, 0.72);
      background: rgba(255, 253, 250, 0.72);
      font-size: 0.9rem;
    }

    .room-caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 15px 18px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .room-caption strong { color: var(--ink); font-weight: 700; }

    .side-column { display: grid; gap: 20px; }

    .card-heading {
      margin: 0;
      padding: 19px 20px 0;
      font-size: 0.9rem;
      font-weight: 750;
      letter-spacing: 0.01em;
    }

    .identity-value {
      margin: 12px 20px 6px;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1rem;
      font-weight: 700;
    }

    .identity-help {
      margin: 0;
      padding: 0 20px 20px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.65;
    }

    .edit-entry {
      display: grid;
      gap: 8px;
      padding: 20px;
      border: 1px dashed #b9c7b9;
      border-radius: 20px;
      color: var(--accent);
      background: var(--accent-soft);
    }

    .edit-entry-title { font-size: 0.94rem; font-weight: 750; }
    .edit-entry-note { color: #55705b; font-size: 0.82rem; line-height: 1.55; }

    .assets-card { margin-top: 20px; }

    .assets-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 19px 20px 13px;
    }

    .assets-header h2 { margin: 0; font-size: 1rem; }
    .asset-count { color: var(--muted); font-size: 0.82rem; }

    .asset-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 12px;
      padding: 0 20px 20px;
    }

    .asset-item {
      min-width: 0;
      padding: 10px;
      border: 1px solid #ebe5dc;
      border-radius: 13px;
      background: #fff;
    }

    .asset-preview {
      display: grid;
      place-items: center;
      aspect-ratio: 1 / 0.8;
      overflow: hidden;
      border-radius: 8px;
      background: #f1eee8;
    }

    .asset-preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .asset-fallback {
      color: var(--muted);
      font-size: 0.74rem;
      text-align: center;
    }

    .asset-name {
      display: block;
      margin-top: 9px;
      overflow: hidden;
      color: var(--ink);
      font-size: 0.78rem;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .asset-kind {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.7rem;
    }

    .empty-assets {
      margin: 0;
      padding: 0 20px 22px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.6;
    }

    @media (max-width: 760px) {
      .page-shell { width: min(100% - 24px, 1100px); padding-top: 22px; }
      .intro { display: block; }
      .room-layout { grid-template-columns: 1fr; }
      .room-stage { aspect-ratio: 4 / 3; }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="site-header">
      <p class="brand">Roomfolio</p>
      <p class="page-label">Author Home</p>
    </header>

    <section id="status-card" class="status-card" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="status-message">あなたのRoomfolioを確認しています。</span>
    </section>

    <section id="home-content" class="home-content" hidden aria-labelledby="home-title">
      <div class="intro">
        <div>
          <h1 id="home-title">自分のRoom</h1>
          <p>あなたのRoomfolioを確認・管理するためのページです。</p>
        </div>
      </div>

      <div class="room-layout">
        <article class="room-card" aria-labelledby="room-title">
          <div id="room-stage" class="room-stage" role="img" aria-label="自分のRoomの背景"></div>
          <div class="room-caption">
            <strong id="room-title">My Room</strong>
            <span id="room-theme">Theme: —</span>
          </div>
        </article>

        <aside class="side-column">
          <section class="identity-card" aria-labelledby="user-id-title">
            <h2 id="user-id-title" class="card-heading">公開ユーザーID</h2>
            <p id="public-user-id" class="identity-value">—</p>
            <p class="identity-help">公開Room URLの確認・共有は、Stage 3で実装します。</p>
          </section>

          <section class="edit-entry" aria-label="Editへの入口">
            <span class="edit-entry-title">Roomを編集する</span>
            <span class="edit-entry-note">編集機能はStage 2で利用可能になります。</span>
          </section>
        </aside>
      </div>

      <section class="assets-card" aria-labelledby="assets-title">
        <div class="assets-header">
          <h2 id="assets-title">Roomのassets</h2>
          <span id="asset-count" class="asset-count">0 assets</span>
        </div>
        <div id="asset-list" class="asset-list"></div>
        <p id="empty-assets" class="empty-assets" hidden>このRoomにはまだassetsがありません。</p>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-client.js"></script>
  <script>
    (() => {
      "use strict";

      const statusCard = document.getElementById("status-card");
      const statusMessage = document.getElementById("status-message");
      const homeContent = document.getElementById("home-content");
      const roomStage = document.getElementById("room-stage");
      const roomTheme = document.getElementById("room-theme");
      const publicUserId = document.getElementById("public-user-id");
      const assetCount = document.getElementById("asset-count");
      const assetList = document.getElementById("asset-list");
      const emptyAssets = document.getElementById("empty-assets");
      const supabaseClient = window.supabaseClient;

      function setStatus(message, isError = false) {
        statusMessage.textContent = message;
        statusCard.hidden = !message;
        statusCard.classList.toggle("is-error", isError);
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function resolveAssetPreview(asset) {
        if (asset.asset_type === "original") {
          return asset.image_url || asset.original_image_url || "";
        }
        if (asset.asset_type === "object") {
          return asset.object_asset || "";
        }
        return asset.frame_asset || "";
      }

      function renderAssets(assets) {
        const visibleAssets = (assets || []).slice(0, 8);
        assetCount.textContent = `${visibleAssets.length} assets`;
        assetList.innerHTML = "";
        emptyAssets.hidden = visibleAssets.length !== 0;

        visibleAssets.forEach((asset) => {
          const previewUrl = resolveAssetPreview(asset);
          const label = String(asset.title || asset.asset_type || "asset");
          const kind = String(asset.asset_type || "asset");
          const item = document.createElement("article");
          item.className = "asset-item";
          item.innerHTML = `
            <div class="asset-preview">
              ${previewUrl
                ? `<img src="${escapeHtml(previewUrl)}" alt="${escapeHtml(label)}">`
                : '<span class="asset-fallback">画像を確認できません。</span>'}
            </div>
            <span class="asset-name">${escapeHtml(label)}</span>
            <span class="asset-kind">${escapeHtml(kind)}</span>
          `;
          assetList.appendChild(item);
        });
      }

      async function loadAuthorHome() {
        if (!supabaseClient) {
          setStatus("Homeの準備に失敗しました。時間をおいて再度お試しください。", true);
          return;
        }

        try {
          const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
          if (sessionError) throw sessionError;

          if (!sessionData?.session) {
            window.location.replace("/login");
            return;
          }

          const { data: authData, error: authError } = await supabaseClient.auth.getUser();
          if (authError) throw authError;

          const authUser = authData?.user;
          if (!authUser) {
            window.location.replace("/login");
            return;
          }

          const { data: room, error: roomError } = await supabaseClient
            .from("rooms")
            .select("id, roomfolio_user_id, background, theme")
            .eq("user_id", authUser.id)
            .maybeSingle();

          if (roomError) throw roomError;

          if (!room) {
            setStatus("このアカウントに対応するRoomが確認できません。Roomは自動で作成されません。", true);
            return;
          }

          const { data: assets, error: assetError } = await supabaseClient
            .from("assets")
            .select("id, asset_type, frame_asset, object_asset, image_url, original_image_url, title, description, placement_position, sort_order")
            .eq("room_id", room.id)
            .order("sort_order", { ascending: true });

          if (assetError) throw assetError;

          publicUserId.textContent = room.roomfolio_user_id || "—";
          roomTheme.textContent = room.theme ? `Theme: ${room.theme}` : "Theme: —";

          if (room.background) {
            roomStage.style.backgroundImage = `url("${String(room.background).replace(/"/g, "\\\"")}")`;
            roomStage.classList.remove("is-empty");
          } else {
            roomStage.classList.add("is-empty");
          }

          renderAssets(assets || []);
          homeContent.hidden = false;
          setStatus("");
        } catch (error) {
          console.error("作者用Homeの読み込みに失敗しました", error);
          setStatus("Roomfolioを確認できませんでした。時間をおいて再度お試しください。", true);
        }
      }

      loadAuthorHome();
    })();
  </script>
</body>
</html>
